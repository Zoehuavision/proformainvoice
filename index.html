<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PI 备注用语速查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2b3a; --ink-soft:#4d5f70; --paper:#f3f0e7; --paper-raised:#fbf9f3;
  --line:#c9c2ae; --stamp:#8a3324; --stamp-soft:#c85a3d; --seal:#1f5f4f;
  --chip-bg:#e9e3d2; --chip-active:#1c2b3a; --chip-active-text:#f3f0e7;
  --shadow:0 1px 0 rgba(28,43,58,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef1f4; --ink-soft:#aab6c2; --paper:#151b22; --paper-raised:#1d252e;
    --line:#3a4553; --stamp:#e2846a; --stamp-soft:#c85a3d; --seal:#4fae94;
    --chip-bg:#232c36; --chip-active:#eef1f4; --chip-active-text:#151b22;
  }
}
:root[data-theme="dark"]{
  --ink:#eef1f4; --ink-soft:#aab6c2; --paper:#151b22; --paper-raised:#1d252e;
  --line:#3a4553; --stamp:#e2846a; --stamp-soft:#c85a3d; --seal:#4fae94;
  --chip-bg:#232c36; --chip-active:#eef1f4; --chip-active-text:#151b22;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  min-height:100%;
}
header{
  padding:28px 20px 18px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--paper); z-index:5;
  padding-top:calc(28px + env(safe-area-inset-top,0px));
}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--stamp); margin:0 0 6px;}
h1{font-family:'Spectral',serif; font-weight:700; font-size:clamp(24px,4vw,34px); margin:0 0 4px; line-height:1.15;}
.sub{color:var(--ink-soft); font-size:14px; margin:0 0 18px; max-width:60ch;}

.searchwrap{position:relative; max-width:640px;}
#search{
  width:100%; padding:13px 44px 13px 16px; border:1.5px solid var(--line); border-radius:2px;
  background:var(--paper-raised); color:var(--ink); font-size:15px; font-family:inherit;
  outline:none; transition:border-color .15s;
}
#search:focus{border-color:var(--seal);}
.searchwrap svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:.5;}

nav.cats{
  display:flex; gap:8px; overflow-x:auto; padding:14px 20px; border-bottom:1px solid var(--line);
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 128px); background:var(--paper); z-index:4;
  scrollbar-width:thin;
}
@media (max-width:640px){ nav.cats{ top:calc(env(safe-area-inset-top,0px) + 150px);} }
.chip{
  flex:0 0 auto; padding:7px 14px; border-radius:20px; background:var(--chip-bg); color:var(--ink);
  font-size:13px; font-weight:500; cursor:pointer; border:1px solid transparent; white-space:nowrap;
  transition:background .15s,color .15s;
}
.chip.active{background:var(--chip-active); color:var(--chip-active-text);}
.chip .n{opacity:.55; margin-left:4px; font-family:'IBM Plex Mono',monospace; font-size:11px;}

main{padding:22px 20px 60px; max-width:920px; margin:0 auto;}
.count{font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin:0 0 14px; letter-spacing:.03em;}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px;}
.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:3px; padding:14px 14px 12px;
  position:relative; box-shadow:var(--shadow);
}
.card.core{border-left:3px solid var(--stamp);}
.card .zh{font-size:15px; font-weight:600; margin:0 0 5px; line-height:1.4; padding-right:30px;}
.card .en{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0;}
.card .tag{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--seal);
  border:1px solid var(--seal); border-radius:10px; padding:1px 7px; margin-top:9px; letter-spacing:.03em;
}
.copybtn{
  position:absolute; top:10px; right:10px; width:26px; height:26px; border:none; background:transparent;
  cursor:pointer; color:var(--ink-soft); border-radius:4px; display:flex; align-items:center; justify-content:center;
  transition:background .15s,color .15s;
}
.copybtn:hover{background:var(--chip-bg); color:var(--ink);}
.copybtn.done{color:var(--seal);}

.empty{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;}

footer{padding:20px; text-align:center; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:20px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:20; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <p class="eyebrow">PI REMARKS · 形式发票备注速查</p>
  <h1>PI 备注用语库</h1>
  <p class="sub">中英对照 · 点击分类筛选 · 点卡片一键复制英文。星标为最常用的核心 20 条。</p>
  <div class="searchwrap">
    <input id="search" type="text" placeholder="搜索中文或英文关键词，如「质保」或 warranty">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>
</header>

<nav class="cats" id="cats"></nav>

<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">没有匹配的用语，换个关键词试试</div>
</main>

<footer>根据 PI 备注用语大全整理 · 43 条固定用语 + 20 条核心用语</footer>
<div class="toast" id="toast">已复制</div>

{c:"清关税费",zh:"31｜目的国税费不含",en:"Import duties and destination charges are not included.",core:1},
{c:"清关税费",zh:"32｜清关费用不含",en:"Customs clearance charges are not included."},
{c:"清关税费",zh:"33｜DDP",en:"DDP shipping is available upon request."},
{c:"清关税费",zh:"34｜目的港费用",en:"Destination charges are not included unless otherwise stated."},

{c:"质保",zh:"35｜12个月质保",en:"12-Month Warranty."},
{c:"质保",zh:"36｜质保期",en:"Warranty period: 12 months from shipment date."},
{c:"质保",zh:"37｜人为损坏不保",en:"Warranty does not cover damage caused by improper use or installation."},
{c:"质保",zh:"38｜未经授权改装不保",en:"Warranty does not cover unauthorized modification."},

{c:"定制Logo",zh:"39｜Logo定制",en:"Customized Logo Available."},
{c:"定制Logo",zh:"40｜客户提供Logo",en:"Customer logo artwork is required before production."},
{c:"定制Logo",zh:"41｜定制产品",en:"Customized Product."},
{c:"定制Logo",zh:"42｜确认后生产",en:"Production will start after artwork confirmation."},
{c:"定制Logo",zh:"43｜定制产品不可退",en:"Customized products are non-returnable once production starts."}
];

const CATS = ["核心20","版本","兼容","品质","包装定制","传感器规格","价格条款","付款条款","生产交期","产品确认","包装运输","清关税费","质保","定制Logo"];

let activeCat = "核心20";
let query = "";

const catsEl = document.getElementById('cats');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function counts(){
  const m = {};
  CATS.forEach(c=>m[c]=0);
  DATA.forEach(d=>{ m[d.c] = (m[d.c]||0)+1; if(d.core) m["核心20"]++; });
  return m;
}
const CT = counts();

function renderCats(){
  catsEl.innerHTML = CATS.map(c=>
    `<button class="chip${c===activeCat?' active':''}" data-cat="${c}">${c==="核心20"?"★ "+c:c}<span class="n">${CT[c]}</span></button>`
  ).join('');
  catsEl.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ activeCat = el.dataset.cat; renderCats(); renderGrid(); });
  });
}

function matches(item){
  if(activeCat === "核心20" && !item.core) return false;
  if(activeCat !== "核心20" && item.c !== activeCat) return false;
  if(query){
    const q = query.toLowerCase();
    if(!item.zh.toLowerCase().includes(q) && !item.en.toLowerCase().includes(q)) return false;
  }
  return true;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderGrid(){
  const items = DATA.filter(matches);
  countEl.textContent = `共 ${items.length} 条`;
  emptyEl.style.display = items.length ? 'none' : 'block';
  gridEl.innerHTML = items.map((item, i)=>{
    const idx = DATA.indexOf(item);
    return `<div class="card${item.core?' core':''}">
      <button class="copybtn" data-idx="${idx}" title="复制英文" aria-label="复制英文">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
      </button>
      <p class="zh">${escapeHtml(item.zh)}</p>
      <p class="en">${escapeHtml(item.en)}</p>
      ${activeCat==="核心20" ? '' : (item.core ? '<span class="tag">核心常用</span>' : '')}
    </div>`;
  }).join('');
  gridEl.querySelectorAll('.copybtn').forEach(btn=>{
    btn.addEventListener('click', ()=>copyItem(btn));
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1400);
}

async function copyItem(btn){
  const item = DATA[+btn.dataset.idx];
  const text = item.en;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e2){}
    document.body.removeChild(ta);
  }
  btn.classList.add('done');
  showToast('已复制：' + (text.length>30? text.slice(0,30)+'…' : text));
  setTimeout(()=>btn.classList.remove('done'), 1000);
}

document.getElementById('search').addEventListener('input', (e)=>{
  query = e.target.value.trim();
  renderGrid();
});

renderCats();
renderGrid();
</script>
</body>
</html>
